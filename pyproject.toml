[project]
name = "vig-octo"
version = "0.1.0"
description = "A MCP server for task management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.2.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.8.0",
    "mypy>=1.15.0",
    "pydantic>=2.11.4",
    "pandas>=2.0.0",
    "sqlalchemy>=2.0.40",
    "tomli>=2.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=server --cov-report=term-missing"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]
